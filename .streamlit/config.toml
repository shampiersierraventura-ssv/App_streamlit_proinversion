[theme]
base = "light"
primaryColor = "#3157D5"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans-serif"
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = false

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true

